name: 🐞 Bug report
description: Something in the notebook is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be reported here**, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /notebook
        2. Write a name
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Firefox, Safari, Other]
  - type: input
    id: os
    attributes:
      label: OS / device
      placeholder: Windows 11, iPhone 15…
  - type: checkboxes
    id: motion
    attributes:
      label: Environment details
      options:
        - label: Reduced motion is enabled
        - label: Happens on mobile
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or console output
